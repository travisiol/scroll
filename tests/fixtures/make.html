<!doctype html>
<!-- Source for the test fixture images in this folder. Not a real device capture: a neutral mock, labelled as such. -->
<meta charset="utf-8" />
<style>
  body { margin: 0; width: 600px; height: 1100px; background: #f2f2f7; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111; }
  .bar { padding: 28px 32px 8px; font-size: 20px; color: #666; display: flex; justify-content: space-between; }
  h1 { margin: 0; padding: 6px 32px 0; font-size: 44px; letter-spacing: -1px; }
  .sub { padding: 6px 32px 18px; font-size: 22px; color: #666; }
  .card { margin: 0 24px 20px; background: #fff; border-radius: 22px; padding: 24px; }
  .total { font-size: 54px; font-weight: 700; letter-spacing: -1.5px; }
  .chart { display: flex; align-items: flex-end; gap: 14px; height: 130px; margin-top: 22px; }
  .chart i { flex: 1; background: #5b8def; border-radius: 6px 6px 0 0; }
  .row { display: flex; justify-content: space-between; padding: 20px 0; border-top: 1px solid #e5e5ea; font-size: 26px; }
  .row:first-of-type { border-top: 0; }
  .row span:last-child { color: #666; }
  .fx { position: fixed; right: 18px; bottom: 16px; font-size: 18px; color: #b3261e; font-weight: 700; }
</style>
<body>
  <div class="bar"><span>Screen time</span><span id="tag"></span></div>
  <h1>Weekly report</h1>
  <div class="sub" id="sub"></div>
  <div class="card">
    <div style="color:#666;font-size:20px">Total for the week</div>
    <div class="total" id="total"></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="card" id="rows"></div>
  <div class="fx">TEST FIXTURE · NOT A REAL DEVICE</div>
  <script>
    const V = {
      a: { sub: "Reporting week A", total: "19h 57m", bars: [40, 70, 55, 90, 60, 100, 75], rows: [["Instagram", "9h 42m"], ["Netflix", "6h 05m"], ["Reddit", "4h 10m"]] },
      b: { sub: "Reporting week B", total: "23h 31m", bars: [80, 60, 95, 50, 70, 85, 100], rows: [["Snapchat", "7h 15m"], ["Instagram", "6h 20m"], ["Netflix", "5h 40m"], ["Facebook", "4h 16m"]] },
      c: { sub: "Reporting week C", total: "11h 02m", bars: [30, 45, 60, 35, 80, 50, 40], rows: [["Reddit", "5h 30m"], ["Roblox", "3h 12m"], ["Instagram", "2h 20m"]] },
      d: { sub: "Reporting week D", total: "15h 48m", bars: [65, 55, 75, 90, 45, 60, 85], rows: [["Roblox", "8h 05m"], ["Snapchat", "4h 33m"], ["Reddit", "3h 10m"]] },
      e: { sub: "Reporting week E", total: "9h 26m", bars: [50, 35, 40, 70, 55, 30, 60], rows: [["Netflix", "5h 12m"], ["Facebook", "2h 44m"], ["Instagram", "1h 30m"]] },
      f: { sub: "Reporting week (dates cropped out)", total: "12h 40m", bars: [45, 60, 50, 65, 80, 55, 70], rows: [["Instagram", "7h 25m"], ["Reddit", "5h 15m"]] },
    }[new URLSearchParams(location.search).get("v") || "a"];
    document.getElementById("sub").textContent = V.sub;
    document.getElementById("tag").textContent = "Week";
    document.getElementById("total").textContent = V.total;
    document.getElementById("chart").innerHTML = V.bars.map((h) => `<i style="height:${h}%"></i>`).join("");
    document.getElementById("rows").innerHTML = V.rows.map(([a, t]) => `<div class="row"><span>${a}</span><span>${t}</span></div>`).join("");
  </script>
</body>
